name: site

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "bench/**"
      - "samples/**"
      - "SPEC.md"
      - "CHANGELOG.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history, not a shallow clone: bench/site_facts.py counts commits
      # and authors for the contribution section, and it refuses to publish a
      # count taken from a truncated history rather than printing a smaller
      # number with the same confidence as a true one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The numbers on the site are generated from the tree at build time, so
      # the build needs the same measurement scripts CI already runs.
      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Generate facts, reference and samples, then build
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
